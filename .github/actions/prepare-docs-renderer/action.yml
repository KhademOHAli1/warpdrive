name: Prepare pinned documentation renderer
description: Fetch the reviewed public renderer commit and optionally stage the current public guides
inputs:
  stage-content:
    description: Stage Warpdrive public guides and assets using the pinned renderer's script
    default: "true"
runs:
  using: composite
  steps:
    - name: Verify the source checkout and fetch the pinned renderer
      id: fetch
      shell: bash
      env:
        STAGE_CONTENT: ${{ inputs.stage-content }}
        GIT_CONFIG_NOSYSTEM: "1"
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_NO_REPLACE_OBJECTS: "1"
        GIT_TERMINAL_PROMPT: "0"
        GIT_ASKPASS: /usr/bin/false
      run: |
        set -euo pipefail
        case "$STAGE_CONTENT" in true|false) ;; *) exit 1 ;; esac
        source="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
        test "$source" = "$GITHUB_SHA"
        revision="$(git -C "$GITHUB_WORKSPACE" show "$source:docs-site/renderer.lock")"
        if ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]] ||
           [[ "$revision" == 0000000000000000000000000000000000000000 ]]; then
          printf '%s\n' 'Invalid pinned Warpdrive docs renderer revision.' >&2
          exit 1
        fi
        destination="$GITHUB_WORKSPACE/.docs-renderer"
        mkdir "$destination"
        git -C "$destination" init --quiet --template=
        env -u GH_TOKEN -u GITHUB_TOKEN -u GH_ENTERPRISE_TOKEN -u GITHUB_ENTERPRISE_TOKEN \
          git -C "$destination" -c credential.helper= -c protocol.file.allow=never \
          fetch --no-tags https://github.com/KhademOHAli1/warpdrive-docs.git \
          refs/heads/main:refs/remotes/origin/main
        git -C "$destination" merge-base --is-ancestor "$revision" refs/remotes/origin/main
        git -C "$destination" checkout --quiet --detach "$revision"
        test "$(git -C "$destination" rev-parse HEAD)" = "$revision"
        printf 'source=%s\nrevision=%s\n' "$source" "$revision" >> "$GITHUB_OUTPUT"
    - name: Set up the renderer's package-pinned Bun
      if: inputs.stage-content == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: .docs-renderer/package.json
    - name: Stage public guides from the verified source checkout
      if: inputs.stage-content == 'true'
      shell: bash
      working-directory: .docs-renderer
      env:
        GIT_NO_REPLACE_OBJECTS: "1"
        SOURCE_REVISION: ${{ steps.fetch.outputs.source }}
        RENDERER_REVISION: ${{ steps.fetch.outputs.revision }}
      run: |
        set -euo pipefail
        test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$SOURCE_REVISION"
        test "$(git rev-parse HEAD)" = "$RENDERER_REVISION"
        bun --no-env-file scripts/stage-content.mjs "$GITHUB_WORKSPACE"
        printf '{"warpdriveRevision":"%s","rendererRevision":"%s"}\n' \
          "$SOURCE_REVISION" "$RENDERER_REVISION" > "$RUNNER_TEMP/docs-preview-provenance.json"
