name: Warpdrive 1.8.1 Core and Web image qualification

on:
  push:
    branches: [codex/headless-1.8.1-image-qualification]

permissions:
  contents: read

concurrency:
  group: warpdrive-headless-1-8-1-qualification
  cancel-in-progress: true

env:
  SOURCE_REVISION: 12b9233bde834fca6628e540256ab4a4065d8a02

jobs:
  images:
    name: Test actual 1.8.1 images on isolated PostgreSQL
    if: github.repository == 'KhademOHAli1/warpdrive'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Check out the qualification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out the exact 1.8.1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_REVISION }}
          path: release-source
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build unmodified release source
        working-directory: release-source
        run: |
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test -z "$(git status --porcelain)"
          test "$(jq -r .version package.json)" = 1.8.1
          docker buildx build --load --platform linux/amd64 --provenance=false \
            --build-arg "APP_COMMIT=$SOURCE_REVISION" --build-arg NEXT_PUBLIC_WS_URL=same-origin \
            --file deploy/images/Web.Dockerfile --target web --tag warpdrive-181/web:qualified .
          docker buildx build --load --platform linux/amd64 --provenance=false \
            --build-arg "APP_COMMIT=$SOURCE_REVISION" --file deploy/images/Core.Dockerfile \
            --target core-api --tag warpdrive-181/core:qualified .
          for component in worker realtime migrator; do
            docker buildx build --load --platform linux/amd64 --provenance=false \
              --build-arg "APP_COMMIT=$SOURCE_REVISION" --file deploy/images/Dockerfile \
              --target "$component" --tag "warpdrive-181/$component:qualified" .
          done
      - name: Exercise final images on the owned fixture
        run: |
          python3 -B scripts/deployment/headless_image_smoke.py \
            --web-image warpdrive-181/web:qualified \
            --core-image warpdrive-181/core:qualified \
            --worker-image warpdrive-181/worker:qualified \
            --realtime-image warpdrive-181/realtime:qualified \
            --migrator-image warpdrive-181/migrator:qualified \
            --expected-revision "$SOURCE_REVISION" \
            --output-dir "$RUNNER_TEMP/headless-smoke"
      - name: Preserve sanitized runtime proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warpdrive-181-image-smoke-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-smoke/report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Save the exact tested Core and Web images
        run: |
          mkdir "$RUNNER_TEMP/headless-images"
          report="$RUNNER_TEMP/headless-smoke/report.json"
          web_id=$(jq -er '.images.web.id | select(test("^sha256:[a-f0-9]{64}$"))' "$report")
          core_id=$(jq -er '.coreImage.id | select(test("^sha256:[a-f0-9]{64}$"))' "$report")
          test "$(docker image inspect --format '{{.Id}}' warpdrive-181/web:qualified)" = "$web_id"
          test "$(docker image inspect --format '{{.Id}}' warpdrive-181/core:qualified)" = "$core_id"
          cd "$RUNNER_TEMP/headless-images"
          docker image save warpdrive-181/core:qualified warpdrive-181/web:qualified | gzip -1 > core-and-web.tar.gz
          sha256sum core-and-web.tar.gz > SHA256SUMS
          cp "$report" report.json
      - name: Retain both tested images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warpdrive-181-tested-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-images/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
