name: Browser smoke CI

on:
  pull_request:
  push:
    branches: [main, integration, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser smoke checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: warpdrive_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d warpdrive_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: 'true'
      BUN_OPTIONS: --no-env-file
      BASE_URL: https://127.0.0.1:3443
      DATABASE_URL: postgres://ci:ci-disposable-only@127.0.0.1:5432/warpdrive_ci
      AUTH_SECRET: ci_browser_only_secret_never_for_deployment_0123456789
      AUTH_MAIL_TRANSPORT: smtp
      AUTH_SMTP_HOST: 127.0.0.1
      AUTH_MAIL_FROM: browser@example.invalid
      AUTH_GOOGLE_ENABLED: 'false'
      SEED_ADMIN_EMAIL: admin@example.invalid
      ALLOW_FIRST_LOGIN_ADMIN: 'false'
      WS_TICKET_SECRET: ci_browser_only_ticket_secret_0123456789
      WS_PUBLIC_URL: ws://127.0.0.1:8080
      NEXT_PUBLIC_WS_URL: ws://127.0.0.1:8080
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_ACCESS_KEY: ci-browser-only
      MINIO_SECRET_KEY: ci-browser-only
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      OAUTH_SIGNING_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      MCP_ENABLED: 'true'
      DISABLE_TELEMETRY: 'true'
      DISABLE_UPDATE_CHECK: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      APP_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install frozen app and browser dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd tests/browser
      - name: Install the pinned Chromium browser
        working-directory: tests/browser
        run: bunx --no-install playwright install --with-deps chromium
      - name: Apply real migrations and create isolated browser fixtures
        env:
          NODE_ENV: production
        run: |
          bun --no-env-file src/entrypoints/migrate.ts
          bun --no-env-file tests/browser/seed.mjs
      - name: Build the production app with ordinary checks enabled
        env:
          NODE_ENV: production
        run: bun run build
      - name: Create a runner-local HTTPS certificate
        run: |
          mkdir -p tests/browser/.tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout tests/browser/.tls/key.pem -out tests/browser/.tls/cert.pem -subj /CN=127.0.0.1 -addext subjectAltName=IP:127.0.0.1
      - name: Exercise browser smoke flows against the built app
        working-directory: tests/browser
        run: bun run test
      - name: Preserve browser reports and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/
          if-no-files-found: warn
          retention-days: 14
