name: Public Bun CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  crm:
    name: CRM checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up package-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install locked app dependencies
        run: bun install --frozen-lockfile
      - name: Project the locked Web UI dependencies
        run: bun --no-env-file scripts/deployment/install-web-ui.mjs
      - name: Generate and check app types
        run: bun run typecheck
      - name: Check translations and lint
        run: bun run lint
      - name: Run focused product and preference tests
        run: >-
          bun run test:unit --maxWorkers=2
          src/features/theme/appearance.test.ts
          src/features/theme/appearanceBundle.test.ts
          src/features/identity/densityAction.test.ts
          src/features/identity/preferencesSchema.test.ts
          src/features/identity/preferencesSelection.test.ts
          src/features/workflows/draftSimulationAction.test.ts
          src/features/workflows/draftSimulationInput.test.ts
          src/features/workflows/runRetryActions.test.ts
          src/features/billing
          src/features/newsletter
          src/features/goals/kpiSchemas.test.ts
          src/features/goals/goalProgress.test.ts
          src/features/goals/kpiTrend.test.ts
          src/features/i18n/regionalContext.test.ts
          src/features/i18n/useBrowserRegionalContext.test.tsx
          src/app/\(app\)/settings/profile/LanguageSettings.test.tsx
          src/features/privacy/discoveryCoverage.test.ts
          src/features/privacy/registry.test.ts
          src/app/\(app\)/settings/designSystemConformance.test.ts
          src/typeScale.test.ts
          src/paletteTokens.test.ts
          src/app/\(app\)/layout.privacyReturn.test.tsx
          ciWorkflow.test.ts

  site:
    name: Marketing site checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up package-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: site/package.json
      - name: Install locked site dependencies
        run: bun install --frozen-lockfile
      - name: Generate site route types
        run: bun --bun next typegen
      - name: Check site types
        run: bun run typecheck

  docs:
    name: Documentation site checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .docs-renderer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare pinned documentation renderer
        uses: ./.github/actions/prepare-docs-renderer
      - name: Install locked documentation dependencies
        run: bun install --frozen-lockfile
      - name: Check documentation types
        run: bun run typecheck
