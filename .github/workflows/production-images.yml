name: Production image qualification

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "docs-site/**"
      - "site/**"
      - "**/*.md"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "docs-site/**"
      - "site/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      web_release_rehearsal:
        description: Build one additional Web image and rehearse a presentation-only rollout
        type: boolean
        default: false
      core_image_rehearsal:
        description: Build and rehearse the optional standalone Core image
        type: boolean
        default: false
      operations_collector_rehearsal:
        description: Build and rehearse the optional Operations Collector image
        type: boolean
        default: false

# This workflow neither publishes images nor receives production credentials.
permissions:
  contents: read

concurrency:
  group: production-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Deployment tooling checks
    if: github.event.action != 'labeled' || github.event.label.name == 'web-release-rehearsal'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      independent_web: ${{ steps.scope.outputs.independent_web }}
    env:
      # Imported engine guards hash the original build context. Never write Python
      # bytecode into that context while collecting these tooling tests.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select independent qualification for the reviewed Web-only push
        if: github.event_name == 'push'
        id: scope
        env:
          PREVIOUS_REVISION: ${{ github.event.before }}
          CURRENT_REVISION: ${{ github.sha }}
        run: |
          if python3 -B scripts/deployment/web_push_scope.py "$PREVIOUS_REVISION" "$CURRENT_REVISION"; then
            echo 'independent_web=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Test component selection and failure admission
        run: |
          node --test scripts/deployment/image-build.test.mjs
          python3 -m unittest discover -s scripts/deployment -p 'test_*.py' -v

  images:
    name: Final production image smoke
    needs: tooling
    if: needs.tooling.outputs.independent_web != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Strict source admission rejects unknown files, including generated bytecode.
      PYTHONDONTWRITEBYTECODE: "1"
      IMAGE_PREFIX: warpdrive-ci
      IMAGE_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
      REVISION: ${{ github.sha }}
      WEB_RELEASE_REHEARSAL: ${{ (github.event_name == 'workflow_dispatch' && inputs.web_release_rehearsal) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'web-release-rehearsal')) }}
      CORE_IMAGE_REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && inputs.core_image_rehearsal }}
      OPERATIONS_COLLECTOR_REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && inputs.operations_collector_rehearsal }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Admit native disposable runner disk budget
        # Initial CI budget, not a production sizing declaration. Runtime admission uses
        # measured candidate expansion, migration/WAL and operating-reserve inputs.
        run: |
          available=$(python3 -c 'import os; s=os.statvfs("."); print(s.f_bavail*s.f_frsize)')
          python3 scripts/deployment/candidate.py capacity \
            --available-bytes "$available" --candidate-bytes 6442450944 \
            --migration-bytes 1073741824 --temporary-bytes 4294967296 \
            --reserve-bytes 4294967296
          test "$(uname -m)" = x86_64
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install locked source tooling on the disposable runner
        env:
          NODE_ENV: development
          BUN_OPTIONS: --no-env-file
        run: bun --no-env-file install --frozen-lockfile
      - name: Verify fresh component inputs before image compilation
        id: image-inputs
        run: |
          RUN_IMAGE_CONTEXT_IMPORT_CHECK=1 node --test --test-name-pattern 'Docker context keeps local TypeScript imports' scripts/deployment/image-build.test.mjs
          node --test scripts/deployment/component_inputs.test.mjs scripts/deployment/web_inputs.test.mjs scripts/deployment/web_sdk_full_inputs.test.mjs scripts/deployment/web_sdk_imports.test.mjs scripts/deployment/web_sdk_switch_fixture.test.mjs
          node --test scripts/deployment/web_functional_source.test.mjs scripts/deployment/web_functional_capabilities.test.mjs
          node --test scripts/deployment/web_protected_projection.test.mjs scripts/deployment/web_client_effect_projection.test.mjs
          proof="$RUNNER_TEMP/production-images"
          mkdir -p "$proof"
          sdk_inputs=$(git --no-replace-objects ls-tree -r --name-only "$REVISION" -- \
            deploy/images/Web.Dockerfile tools/web-ui/package.json tools/web-ui/bun.lock)
          boundary_args=()
          if [[ -n "$sdk_inputs" ]]; then
            context="$RUNNER_TEMP/production-sdk-web-context"
            python3 -B scripts/deployment/web_sdk_full_receipt.py prepare \
              --root "$GITHUB_WORKSPACE" --revision "$REVISION" --context "$context" \
              --output "$proof/component-inputs.json"
            boundary_args=(--sdk-revision "$REVISION")
            printf 'profile=sdk\ncontext=%s\nrecipe=%s\n' "$context" "$context/deploy/images/Web.Dockerfile" >> "$GITHUB_OUTPUT"
          else
            node scripts/deployment/component_inputs.mjs \
              --base-image oven/bun@sha256:3f23864d3e8c923975c61971cabe67ee3d5a728f1e25a559256b95af719a3478 \
              --platform linux/amd64 --build-arg NEXT_PUBLIC_WS_URL=same-origin > "$proof/component-inputs.json"
            python3 scripts/deployment/component_inputs.py --receipt "$proof/component-inputs.json" --root "$GITHUB_WORKSPACE"
            printf 'profile=legacy\ncontext=.\nrecipe=deploy/images/Dockerfile\n' >> "$GITHUB_OUTPUT"
          fi
          node scripts/deployment/component_boundaries.mjs \
            "${boundary_args[@]}" \
            --base-image oven/bun@sha256:3f23864d3e8c923975c61971cabe67ee3d5a728f1e25a559256b95af719a3478 \
            --platform linux/amd64 --build-arg NEXT_PUBLIC_WS_URL=same-origin \
            > "$proof/component-boundaries.json"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build final Web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ steps.image-inputs.outputs.context }}
          file: ${{ steps.image-inputs.outputs.recipe }}
          target: web
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE_PREFIX }}/web:${{ env.IMAGE_TAG }}
          build-args: |
            APP_COMMIT=${{ env.REVISION }}
            NEXT_PUBLIC_WS_URL=same-origin
          cache-from: type=gha,scope=warpdrive-production-web
          cache-to: type=gha,mode=max,scope=warpdrive-production-web
      - name: Build final Worker image without Next compilation
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/images/Dockerfile
          target: worker
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE_PREFIX }}/worker:${{ env.IMAGE_TAG }}
          build-args: APP_COMMIT=${{ env.REVISION }}
          cache-from: type=gha,scope=warpdrive-production-worker
          cache-to: type=gha,mode=max,scope=warpdrive-production-worker
      - name: Build final Realtime image without Next compilation
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/images/Dockerfile
          target: realtime
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE_PREFIX }}/realtime:${{ env.IMAGE_TAG }}
          build-args: APP_COMMIT=${{ env.REVISION }}
          cache-from: type=gha,scope=warpdrive-production-realtime
          cache-to: type=gha,mode=max,scope=warpdrive-production-realtime
      - name: Build final Migrator image without Next compilation
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/images/Dockerfile
          target: migrator
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE_PREFIX }}/migrator:${{ env.IMAGE_TAG }}
          build-args: APP_COMMIT=${{ env.REVISION }}
          cache-from: type=gha,scope=warpdrive-production-migrator
          cache-to: type=gha,mode=max,scope=warpdrive-production-migrator
      - name: Exercise actual final images with no source mounts
        run: |
          python3 scripts/deployment/image_smoke.py \
            --web-image "$IMAGE_PREFIX/web:$IMAGE_TAG" \
            --worker-image "$IMAGE_PREFIX/worker:$IMAGE_TAG" \
            --realtime-image "$IMAGE_PREFIX/realtime:$IMAGE_TAG" \
            --migrator-image "$IMAGE_PREFIX/migrator:$IMAGE_TAG" \
            --expected-revision "$REVISION" \
            --output-dir "$RUNNER_TEMP/production-images/smoke"
      - name: Build optional standalone Core image
        if: env.CORE_IMAGE_REHEARSAL == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/images/Core.Dockerfile
          target: core-api
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE_PREFIX }}/core-api:${{ env.IMAGE_TAG }}
          build-args: APP_COMMIT=${{ env.REVISION }}
          cache-from: type=gha,scope=warpdrive-production-core-api
          cache-to: type=gha,mode=max,scope=warpdrive-production-core-api
      - name: Rehearse optional Core against exact Web and Migrator images
        if: env.CORE_IMAGE_REHEARSAL == 'true'
        run: |
          report="$RUNNER_TEMP/production-images/smoke/report.json"
          python3 -B scripts/deployment/core_image_smoke.py \
            --core-image "$IMAGE_PREFIX/core-api:$IMAGE_TAG" \
            --web-image "$(jq -er '.images.web.id' "$report")" \
            --worker-image "$(jq -er '.images.worker.id' "$report")" \
            --realtime-image "$(jq -er '.images.realtime.id' "$report")" \
            --migrator-image "$(jq -er '.images.migrator.id' "$report")" \
            --expected-revision "$REVISION" \
            --output-dir "$RUNNER_TEMP/production-images/optional-core-smoke"
      - name: Build optional Operations Collector image
        if: env.OPERATIONS_COLLECTOR_REHEARSAL == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/images/OperationsCollector.Dockerfile
          target: operations-collector
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE_PREFIX }}/operations-collector:${{ env.IMAGE_TAG }}
          build-args: APP_COMMIT=${{ env.REVISION }}
          cache-from: type=gha,scope=warpdrive-production-operations-collector
          cache-to: type=gha,mode=max,scope=warpdrive-production-operations-collector
      - name: Rehearse collector admission and signed delivery in the final image
        if: env.OPERATIONS_COLLECTOR_REHEARSAL == 'true'
        run: |
          report="$RUNNER_TEMP/production-images/smoke/report.json"
          python3 -B scripts/deployment/operations_collector_image_smoke.py \
            --collector-image "$IMAGE_PREFIX/operations-collector:$IMAGE_TAG" \
            --web-image "$(jq -er '.images.web.id' "$report")" \
            --worker-image "$(jq -er '.images.worker.id' "$report")" \
            --realtime-image "$(jq -er '.images.realtime.id' "$report")" \
            --migrator-image "$(jq -er '.images.migrator.id' "$report")" \
            --expected-revision "$REVISION" \
            --output-dir "$RUNNER_TEMP/production-images/operations-collector-smoke"
      - name: Verify SDK packaging in exact final image IDs
        if: steps.image-inputs.outputs.profile == 'sdk'
        run: |
          proof="$RUNNER_TEMP/production-images"
          for component in web worker realtime migrator; do
            image=$(jq -er --arg component "$component" '.images[$component].id | select(test("^sha256:[a-f0-9]{64}$"))' "$proof/smoke/report.json")
            docker run --rm --pull never --network none --read-only --entrypoint bun "$image" --no-env-file -e '
              import { readFileSync, existsSync } from "node:fs";
              import { createRequire } from "node:module";
              const component = process.argv.at(-1);
              const sdk = ["core", "react"];
              if (typeof process.getuid !== "function" || process.getuid() === 0) throw Error("SDK probe ran as root");
              for (const packageName of sdk) {
                const name = "@ui-sdk/" + packageName;
                const dir = "/app/node_modules/" + name;
                if (component !== "web") {
                  if (existsSync(dir)) throw Error("Web SDK entered a backend image");
                  continue;
                }
                const metadata = JSON.parse(readFileSync(dir + "/package.json", "utf8"));
                if (metadata.name !== name || metadata.version !== "0.1.0-beta.1" || existsSync(dir + "/node_modules")) throw Error("Unexpected Web SDK package");
                const fromSdk = createRequire(dir + "/package.json");
                const fromApp = createRequire("/app/package.json");
                for (const singleton of ["react", "react-dom"])
                  if (fromSdk.resolve(singleton) !== fromApp.resolve(singleton)) throw Error("SDK uses a separate React runtime");
              }
              if (component === "web") {
                for (const path of ["menu", "dialog", "drawer", "switch", "checkbox", "combobox"])
                  if (!import.meta.resolve("@ui-sdk/react/" + path).startsWith("file:///app/node_modules/@ui-sdk/react/")) throw Error("Unexpected SDK module path");
                const { Switch, SwitchThumb } = await import("@ui-sdk/react/switch");
                if (typeof Switch !== "function" || typeof SwitchThumb !== "function") throw Error("Unexpected SDK Switch exports");
                const { Checkbox } = await import("@ui-sdk/react/checkbox");
                const { DialogBackdrop, createDialogController } = await import("@ui-sdk/react/dialog");
                const combobox = await import("@ui-sdk/react/combobox");
                if (typeof Checkbox !== "function" || typeof DialogBackdrop !== "function" || typeof createDialogController !== "function" || ["Combobox", "ComboboxContent", "ComboboxEmpty", "ComboboxInput", "ComboboxItem", "ComboboxList", "ComboboxTrigger", "createComboboxController"].some((name) => typeof combobox[name] !== "function")) throw Error("Unexpected SDK checkbox, dialog or combobox exports");
              }
              console.log(JSON.stringify({component, sdkPresent: component === "web"}));
            ' "$component" > "$proof/sdk-packaging-$component.json"
          done
      - name: Bind smoke evidence to exact inspected image IDs
        env:
          SDK_WEB_PROFILE: ${{ steps.image-inputs.outputs.profile }}
          SDK_WEB_CONTEXT: ${{ steps.image-inputs.outputs.context }}
        run: |
          mkdir -p "$RUNNER_TEMP/production-images/inspections"
          for component in web worker realtime migrator; do
            docker image inspect "$IMAGE_PREFIX/$component:$IMAGE_TAG" \
              > "$RUNNER_TEMP/production-images/inspections/$component.json"
          done
          context_args=()
          if [[ "$SDK_WEB_PROFILE" == sdk ]]; then
            context_args=(--web-context "$SDK_WEB_CONTEXT")
          fi
          python3 scripts/deployment/candidate.py record \
            --revision "$REVISION" \
            --report "$RUNNER_TEMP/production-images/smoke/report.json" \
            --inspections "$RUNNER_TEMP/production-images/inspections" \
            --inputs "$RUNNER_TEMP/production-images/component-inputs.json" \
            "${context_args[@]}" \
            --output "$RUNNER_TEMP/production-images/candidate.json"
      - name: Bundle the exact tested image IDs without rebuilding
        run: |
          python3 scripts/deployment/bundle.py pack \
            --candidate-dir "$RUNNER_TEMP/production-images" \
            --output-dir "$RUNNER_TEMP/image-bundle" --expected-revision "$REVISION" \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF"
      - name: Verify registry roundtrip and rejection against owned local fixture
        run: |
          python3 scripts/deployment/registry_smoke.py \
            --bundle-dir "$RUNNER_TEMP/image-bundle" --expected-revision "$REVISION" \
            --output-dir "$RUNNER_TEMP/production-images/registry-smoke"
      - name: Verify active worker drain and retained work in final image
        run: |
          python3 scripts/deployment/drain_smoke.py \
            --bundle-dir "$RUNNER_TEMP/image-bundle" --expected-revision "$REVISION" \
            --output-dir "$RUNNER_TEMP/production-images/worker-drain"
      - name: Verify expired worker callback drain without replaying the failed job
        run: |
          python3 scripts/deployment/drain_smoke.py \
            --bundle-dir "$RUNNER_TEMP/image-bundle" --expected-revision "$REVISION" \
            --output-dir "$RUNNER_TEMP/production-images/worker-overrun" --scenario overrun
      - name: Verify authenticated realtime drain and fresh resubscription
        run: |
          python3 scripts/deployment/ws_drain_smoke.py \
            --bundle-dir "$RUNNER_TEMP/image-bundle" --expected-revision "$REVISION" \
            --output-dir "$RUNNER_TEMP/production-images/realtime-drain"
      - name: Rehearse same-version Web switching through owned Caddy
        run: |
          python3 scripts/deployment/web_switch_smoke.py \
            --bundle-dir "$RUNNER_TEMP/image-bundle" --expected-revision "$REVISION" \
            --output-dir "$RUNNER_TEMP/production-images/web-switch" --require-web-generation
      - name: Install locked browser tooling on the disposable runner
        env:
          NODE_ENV: development
          BUN_OPTIONS: --no-env-file
        run: |
          bun --no-env-file install --cwd tools/browser-smoke --frozen-lockfile --ignore-scripts
          bun --no-env-file tools/browser-smoke/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify persistent browser recovery after realtime-only restart
        env:
          BUN_OPTIONS: --no-env-file
        run: |
          python3 scripts/deployment/browser_realtime_smoke.py \
            --bundle-dir "$RUNNER_TEMP/image-bundle" --expected-revision "$REVISION" \
            --output-dir "$RUNNER_TEMP/production-images/browser-realtime"
      - name: Verify source inputs of one presentation-only candidate
        if: env.WEB_RELEASE_REHEARSAL == 'true'
        id: web-release-source
        run: |
          scratch="$RUNNER_TEMP/warpdrive-web-release"
          manifest_sha=$(sha256sum "$RUNNER_TEMP/image-bundle/bundle.json" | cut -d ' ' -f 1)
          changed=$(python3 scripts/deployment/web_release_rehearsal.py \
            --root "$GITHUB_WORKSPACE" --scratch "$scratch" \
            --bundle-dir "$RUNNER_TEMP/image-bundle" --expected-revision "$REVISION" \
            --baseline-manifest-sha256 "$manifest_sha")
          test "${#changed}" -eq 40
          cp "$scratch/source-delta.json" "$RUNNER_TEMP/production-images/web-release-source.json"
          context=$(jq -er '.webBuildContext | select(. == "source" or . == "context")' "$scratch/source-delta.json")
          recipe=$(jq -er '.webRecipe | select(. == "deploy/images/Dockerfile" or . == "deploy/images/Web.Dockerfile")' "$scratch/source-delta.json")
          printf 'revision=%s\nbaseline-manifest-sha=%s\ncontext=%s\nrecipe=%s\n' \
            "$changed" "$manifest_sha" "$scratch/$context" "$scratch/$context/$recipe" >> "$GITHUB_OUTPUT"
      - name: Build only the presentation candidate Web image
        if: env.WEB_RELEASE_REHEARSAL == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ steps.web-release-source.outputs.context }}
          file: ${{ steps.web-release-source.outputs.recipe }}
          target: web
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE_PREFIX }}/web-release:${{ env.IMAGE_TAG }}
          build-args: |
            APP_COMMIT=${{ steps.web-release-source.outputs.revision }}
            NEXT_PUBLIC_WS_URL=same-origin
          cache-from: type=gha,scope=warpdrive-production-web
      - name: Rehearse mixed-image Web rollout and restoration
        if: env.WEB_RELEASE_REHEARSAL == 'true'
        env:
          WEB_REVISION: ${{ steps.web-release-source.outputs.revision }}
          BASELINE_MANIFEST_SHA: ${{ steps.web-release-source.outputs.baseline-manifest-sha }}
        run: |
          web_image=$(docker image inspect --format '{{.Id}}' "$IMAGE_PREFIX/web-release:$IMAGE_TAG")
          python3 scripts/deployment/web_release_rehearsal.py \
            --root "$GITHUB_WORKSPACE" --scratch "$RUNNER_TEMP/warpdrive-web-release" \
            --bundle-dir "$RUNNER_TEMP/image-bundle" --expected-revision "$REVISION" \
            --baseline-manifest-sha256 "$BASELINE_MANIFEST_SHA" --verify-built-image "$web_image" \
            > "$RUNNER_TEMP/production-images/web-release-build.json"
          topbar_gaps=$(jq -er '.topBarGaps | if . == [24,22] or . == [20,18] then join(" ") else error("unreviewed gap pair") end' \
            "$RUNNER_TEMP/production-images/web-release-build.json")
          read -r old_gap new_gap <<< "$topbar_gaps"
          python3 scripts/deployment/web_mixed_image_smoke.py \
            --bundle-dir "$RUNNER_TEMP/image-bundle" --baseline-revision "$REVISION" \
            --baseline-manifest-sha256 "$BASELINE_MANIFEST_SHA" \
            --new-web-image-id "$web_image" --new-web-revision "$WEB_REVISION" \
            --topbar-gaps "$old_gap" "$new_gap" \
            --output-dir "$RUNNER_TEMP/production-images/web-release" --browser
      - name: Verify the tested Web image can be archived independently
        if: env.WEB_RELEASE_REHEARSAL == 'true'
        env:
          WEB_REVISION: ${{ steps.web-release-source.outputs.revision }}
        run: |
          web_image=$(docker image inspect --format '{{.Id}}' "$IMAGE_PREFIX/web-release:$IMAGE_TAG")
          scratch="$RUNNER_TEMP/warpdrive-web-release"
          web_archive="$scratch/web-image.tar"
          available=$(python3 -c 'import os; s=os.statvfs(os.environ["RUNNER_TEMP"]); print(s.f_bavail*s.f_frsize)')
          python3 scripts/deployment/candidate.py capacity \
            --available-bytes "$available" --candidate-bytes 3221225472 \
            --migration-bytes 0 --temporary-bytes 0 --reserve-bytes 4294967296
          test ! -e "$web_archive"
          trap 'rm -f -- "$web_archive"' EXIT
          docker image save --platform linux/amd64 --output "$web_archive" "$web_image"
          PYTHONPATH=scripts/deployment python3 - "$scratch" "$web_image" "$WEB_REVISION" \
            > "$RUNNER_TEMP/production-images/web-release-archive.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          from web_candidate import verify_saved_web_image

          result = verify_saved_web_image(Path(sys.argv[1]), expected_image_id=sys.argv[2],
                                          expected_revision=sys.argv[3])
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Rehearse both Web generations through one retained Core image
        if: env.WEB_RELEASE_REHEARSAL == 'true' && env.CORE_IMAGE_REHEARSAL == 'true'
        timeout-minutes: 12
        env:
          WEB_REVISION: ${{ steps.web-release-source.outputs.revision }}
          BASELINE_MANIFEST_SHA: ${{ steps.web-release-source.outputs.baseline-manifest-sha }}
        run: |
          web_image=$(jq -er '.image.imageId' "$RUNNER_TEMP/production-images/web-release-archive.json")
          core_image=$(jq -er '.coreImage.id' "$RUNNER_TEMP/production-images/optional-core-smoke/report.json")
          test "$web_image" = "$(docker image inspect --format '{{.Id}}' "$IMAGE_PREFIX/web-release:$IMAGE_TAG")"
          test "$core_image" = "$(docker image inspect --format '{{.Id}}' "$IMAGE_PREFIX/core-api:$IMAGE_TAG")"
          python3 -B scripts/deployment/core_mixed_image_smoke.py \
            --baseline-preloaded --bundle-dir "$RUNNER_TEMP/image-bundle" --baseline-revision "$REVISION" \
            --baseline-manifest-sha256 "$BASELINE_MANIFEST_SHA" --new-web-image-id "$web_image" \
            --new-web-revision "$WEB_REVISION" --core-image-id "$core_image" --core-revision "$REVISION" \
            --output-dir "$RUNNER_TEMP/production-images/core-mixed-web"
      - name: Clean up only the owned presentation source checkout
        if: always() && env.WEB_RELEASE_REHEARSAL == 'true'
        run: |
          python3 scripts/deployment/web_release_rehearsal.py \
            --root "$GITHUB_WORKSPACE" --scratch "$RUNNER_TEMP/warpdrive-web-release" --cleanup
      - name: Retain exact tested bundle for main candidate publication
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-bundle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-bundle/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Preserve qualification and failed-first evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-images-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-images/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
