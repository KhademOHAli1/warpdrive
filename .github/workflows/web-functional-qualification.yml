name: Functional independent Web qualification

on:
  workflow_dispatch:
    inputs:
      tooling_revision:
        description: Protected adapter and Web tooling baseline
        required: true
        type: string
      profile_sha256:
        description: Canonical SHA-256 of the reviewed functional Web profile
        required: true
        type: string
      installed_lineage_sha256:
        description: Digest of the current installed Web pair
        required: true
        type: string
      active_publication_sha256:
        description: Digest of the current active Web publication receipt
        required: true
        type: string
      active_publication_bytes:
        description: Exact byte count of the current active Web publication receipt
        required: true
        type: string
      custody:
        description: Select private registry custody or the original unexpired Actions artifacts
        required: true
        type: choice
        default: registry
        options: [registry, original-actions]

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: warpdrive-independent-web-qualification
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify functional Web against the retained backend
    if: github.repository == 'KhademOHAli1/warpdrive' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      BUN_OPTIONS: --no-env-file
      CANDIDATE_REVISION: ${{ github.sha }}
      TOOLING_REVISION: ${{ inputs.tooling_revision }}
      PROFILE_SHA: ${{ inputs.profile_sha256 }}
      LINEAGE_SHA: ${{ inputs.installed_lineage_sha256 }}
      ACTIVE_PUBLICATION_SHA: ${{ inputs.active_publication_sha256 }}
      ACTIVE_PUBLICATION_BYTES: ${{ inputs.active_publication_bytes }}
      CORE_REVISION: 6b24e23cffb32c09089d7020252cc787e3b5bf51
      CORE_MANIFEST_SHA: 28ad2697428b302cbd69af23390214453e86e040df958380deef9a3f608d2b55
      CORE_ADMISSION_SHA: baecbd9e5ac8a27a9948c43fc5bd16fef4b3e268c55b92ff6061f88f7664e3d8
      PREVIOUS_PUBLICATION_SHA: d66b71fa2c22384ec4dc5eb300e2ed72cd1aa71e0f58b2c23e7f2eb1938dd439
      PREDECESSOR_LINEAGE_SHA: 0a51b39635013c27a7838ccd596f5c9a651e8c76b145c82c57eb4e3634c1209f
      WEB_IMAGE: warpdrive-ci/web-functional:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the selected functional release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$CANDIDATE_REVISION"
          [[ "$TOOLING_REVISION" =~ ^[0-9a-f]{40}$ ]]
          for pin in "$PROFILE_SHA" "$LINEAGE_SHA" "$ACTIVE_PUBLICATION_SHA"; do
            [[ "$pin" =~ ^[0-9a-f]{64}$ ]]
          done
          [[ "$ACTIVE_PUBLICATION_BYTES" =~ ^[1-9][0-9]{0,5}$ ]]
          test "$TOOLING_REVISION" != "$CANDIDATE_REVISION"
          git --no-replace-objects merge-base --is-ancestor "$TOOLING_REVISION" "$CANDIDATE_REVISION"
          git -c core.hooksPath=/dev/null worktree add --detach "$RUNNER_TEMP/functional-seed" "$CORE_REVISION"
          umask 077
          mkdir "$RUNNER_TEMP/functional-proof" "$RUNNER_TEMP/functional-projection"
          git --no-replace-objects show "$TOOLING_REVISION:scripts/deployment/web-functional-profile.json" \
            > "$RUNNER_TEMP/functional-proof/profile.json"
      - name: Install attested ORAS
        if: inputs.custody == 'registry'
        id: oras
        uses: ./.github/actions/install-custody-oras
      - name: Retrieve the exact accepted Web and backend artifacts
        id: retained
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTODY_ORAS: ${{ steps.oras.outputs.binary }}
          CUSTODY_SOURCE: ${{ inputs.custody }}
        run: |
          umask 077
          case "$CUSTODY_SOURCE" in
            registry) custody=(--oras "$CUSTODY_ORAS") ;;
            original-actions) custody=(--active-publication-file "$GITHUB_WORKSPACE/scripts/deployment/repeat-web-c-publication.receipt") ;;
            *) exit 1 ;;
          esac
          python3 -B scripts/deployment/web_functional_historical.py \
            "${custody[@]}" --revision "$CANDIDATE_REVISION" \
            --core-admission-sha256 "$CORE_ADMISSION_SHA" --core-manifest-sha256 "$CORE_MANIFEST_SHA" \
            --previous-web-receipt "$GITHUB_WORKSPACE/scripts/deployment/first-web-publication.receipt" \
            --previous-web-receipt-sha256 "$PREVIOUS_PUBLICATION_SHA" \
            --active-publication-sha256 "$ACTIVE_PUBLICATION_SHA" --active-publication-bytes "$ACTIVE_PUBLICATION_BYTES" \
            --predecessor-lineage-sha256 "$PREDECESSOR_LINEAGE_SHA" --output-dir "$RUNNER_TEMP/functional-retained"
          revision=$(jq --exit-status --raw-output '.revision' "$RUNNER_TEMP/functional-retained/active-receipt.json")
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          printf 'active_revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install frozen dependencies into isolated qualification roots
        env:
          NODE_ENV: development
        run: |
          # Admission requires independently stored regular files in both checked roots.
          bun --no-env-file install --frozen-lockfile --backend=copyfile
          bun --no-env-file install --cwd "$RUNNER_TEMP/functional-seed" --frozen-lockfile
          bun --no-env-file install --cwd tools/browser-smoke --frozen-lockfile --ignore-scripts
          bun --no-env-file tools/browser-smoke/node_modules/playwright/cli.js install --with-deps chromium
          projection="$RUNNER_TEMP/functional-projection"
          cp package.json bun.lock bunfig.toml "$projection/"
          cp -R patches "$projection/patches"
          bun --no-env-file install --cwd "$projection" --frozen-lockfile --backend=copyfile
          bun --no-env-file scripts/deployment/install-web-ui.mjs --target "$projection"
          proof="$RUNNER_TEMP/functional-proof"
          curl --fail --silent --show-error --proto '=https' --connect-timeout 15 --max-time 45 --max-filesize 8388608 \
            https://registry.npmjs.org/@ui-sdk/core/-/core-0.1.0-beta.1.tgz --output "$proof/core.tgz"
          curl --fail --silent --show-error --proto '=https' --connect-timeout 15 --max-time 45 --max-filesize 8388608 \
            https://registry.npmjs.org/@ui-sdk/react/-/react-0.1.0-beta.1.tgz --output "$proof/react.tgz"
      - name: Admit functional source, dependencies and exact Docker context
        env:
          ACTIVE_REVISION: ${{ steps.retained.outputs.active_revision }}
        run: |
          test "$(uname -m)" = x86_64
          proof="$RUNNER_TEMP/functional-proof"
          python3 -B scripts/deployment/web_functional_build.py \
            --root "$GITHUB_WORKSPACE" --revision "$CANDIDATE_REVISION" --active-web-revision "$ACTIVE_REVISION" \
            --tooling-revision "$TOOLING_REVISION" --core-revision "$CORE_REVISION" \
            --profile "$proof/profile.json" --profile-sha256 "$PROFILE_SHA" \
            --core-bundle-dir "$RUNNER_TEMP/functional-retained/core" --core-manifest-sha256 "$CORE_MANIFEST_SHA" \
            --web-projection "$RUNNER_TEMP/functional-projection" --sdk-core "$proof/core.tgz" --sdk-react "$proof/react.tgz" \
            --context "$RUNNER_TEMP/functional-context" --output "$proof/inputs.json"
      - name: Recheck selected main before building the functional image
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$CANDIDATE_REVISION"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build exactly one functional Web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ runner.temp }}/functional-context
          file: ${{ runner.temp }}/functional-context/deploy/images/Web.Dockerfile
          target: web
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.WEB_IMAGE }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            NEXT_PUBLIC_WS_URL=same-origin
          cache-from: type=gha,scope=warpdrive-production-web
      - name: Qualify mixed browser continuity and retain the tested Web image
        env:
          ACTIVE_REVISION: ${{ steps.retained.outputs.active_revision }}
        run: |
          proof="$RUNNER_TEMP/functional-proof"
          retained="$RUNNER_TEMP/functional-retained"
          python3 -B scripts/deployment/web_functional_build.py --verify \
            --root "$GITHUB_WORKSPACE" --revision "$CANDIDATE_REVISION" --active-web-revision "$ACTIVE_REVISION" \
            --tooling-revision "$TOOLING_REVISION" --core-revision "$CORE_REVISION" \
            --profile "$proof/profile.json" --profile-sha256 "$PROFILE_SHA" \
            --core-bundle-dir "$retained/core" --core-manifest-sha256 "$CORE_MANIFEST_SHA" \
            --web-projection "$RUNNER_TEMP/functional-projection" --sdk-core "$proof/core.tgz" --sdk-react "$proof/react.tgz" \
            --context "$RUNNER_TEMP/functional-context" --output "$proof/inputs.json"
          image_id=$(docker image inspect --format '{{.Id}}' "$WEB_IMAGE")
          baseline=(--bundle-dir "$retained/core" --baseline-revision "$CORE_REVISION" --baseline-manifest-sha256 "$CORE_MANIFEST_SHA"
            --active-web-bundle "$retained/web" --active-web-publication-receipt "$GITHUB_WORKSPACE/scripts/deployment/first-web-publication.receipt"
            --active-web-publication-receipt-sha256 "$PREVIOUS_PUBLICATION_SHA" --seed-root "$RUNNER_TEMP/functional-seed"
            --successor-web-bundle "$retained/active" --successor-web-publication-receipt "$retained/active-receipt.json"
            --successor-web-publication-receipt-sha256 "$ACTIVE_PUBLICATION_SHA" --successor-web-revision "$ACTIVE_REVISION"
            --predecessor-lineage-sha256 "$PREDECESSOR_LINEAGE_SHA" --new-web-image-id "$image_id" --new-web-revision "$CANDIDATE_REVISION")
          timeout --signal=INT --kill-after=65s 15m python3 -B scripts/deployment/web_mixed_image_smoke.py \
            "${baseline[@]}" --harness-revision "$CANDIDATE_REVISION" --output-dir "$proof/mixed" --browser --sdk-keyboard-help
          python3 -B scripts/deployment/web_functional_candidate.py "${baseline[@]}" \
            --input-path "$proof/inputs.json" --mixed-path "$proof/mixed/report.json" \
            --installed-lineage-sha256 "$LINEAGE_SHA" --output-dir "$RUNNER_TEMP/functional-bundle"
      - name: Recheck selected main before retaining the functional artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$CANDIDATE_REVISION"
      - name: Retain exact tested functional Web artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-functional-image-bundle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/functional-bundle/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Retain sanitized functional qualification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-functional-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/functional-proof/inputs.json
            ${{ runner.temp }}/functional-proof/mixed/report.json
          if-no-files-found: ignore
          retention-days: 14
