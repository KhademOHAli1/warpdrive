name: Accepted functional Web artifact custody
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify both existing objects or publish the admitted artifact once
        required: true
        default: observe
        type: choice
        options: [observe, publish]
      source_revision:
        description: Exact functional Web revision with a tracked release receipt
        required: true
        type: string
      publication_sha256:
        description: SHA-256 of the exact tracked functional publication receipt bytes
        required: true
        type: string

permissions: {}

concurrency:
  group: warpdrive-web-release-custody
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified functional Web custody
    if: github.repository == 'KhademOHAli1/warpdrive' && github.ref == 'refs/heads/main' && inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      SOURCE_REVISION: ${{ inputs.source_revision }}
      PUBLICATION_SHA256: ${{ inputs.publication_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate and verify the exact functional Web ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B scripts/deployment/web_functional_custody.py prepare \
            --source-revision "$SOURCE_REVISION" --publication-sha256 "$PUBLICATION_SHA256"
      - name: Install attested ORAS
        id: oras
        uses: ./.github/actions/install-custody-oras
      - name: Verify authenticated provider state without writing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B scripts/deployment/web_functional_custody.py provider-check \
            --source-revision "$SOURCE_REVISION" --publication-sha256 "$PUBLICATION_SHA256"
      - name: Publish immutable functional Web ${{ inputs.source_revision }}
        if: success() && steps.oras.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTODY_ORAS: ${{ steps.oras.outputs.binary }}
        run: |
          python3 -B scripts/deployment/web_functional_custody.py publish \
            --source-revision "$SOURCE_REVISION" --publication-sha256 "$PUBLICATION_SHA256" --oras "$CUSTODY_ORAS"
      - name: Retain sanitized functional custody outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-functional-custody-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-functional-custody-evidence/*.json
          if-no-files-found: ignore
          retention-days: 30

  observe:
    name: Observe immutable functional Web custody
    if: github.repository == 'KhademOHAli1/warpdrive' && github.ref == 'refs/heads/main' && inputs.mode == 'observe'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      SOURCE_REVISION: ${{ inputs.source_revision }}
      PUBLICATION_SHA256: ${{ inputs.publication_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install attested ORAS
        id: oras
        uses: ./.github/actions/install-custody-oras
      - name: Observe both immutable functional Web objects
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTODY_ORAS: ${{ steps.oras.outputs.binary }}
        run: |
          python3 -B scripts/deployment/web_functional_custody.py observe \
            --source-revision "$SOURCE_REVISION" --publication-sha256 "$PUBLICATION_SHA256" --oras "$CUSTODY_ORAS"
      - name: Retain sanitized functional custody outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-functional-custody-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-functional-custody-evidence/*.json
          if-no-files-found: ignore
          retention-days: 30
