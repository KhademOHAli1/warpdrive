name: Full Public Bun CI

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/full-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  crm:
    name: CRM full checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up package-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install locked app dependencies
        run: bun install --frozen-lockfile
      - name: Project the locked Web UI dependencies
        run: bun --no-env-file scripts/deployment/install-web-ui.mjs
      - name: Generate and check app types
        run: bun run typecheck
      - name: Check translations and lint
        run: bun run lint
      - name: Run app unit tests
        run: bun run test:unit --maxWorkers=2
      - name: Run app PostgreSQL integration tests
        run: bun run test:integration --maxWorkers=2
      - name: Build app with isolated validation placeholders
        run: bun run build
        env:
          NODE_ENV: production
          APP_COMMIT: ${{ github.sha }}
          NEXT_PUBLIC_WS_URL: same-origin
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Build server entrypoints
        run: |
          bun run build:workers
          bun --no-env-file scripts/build-core.mjs

  site:
    name: Marketing site full checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up package-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: site/package.json
      - name: Install locked site dependencies
        run: bun install --frozen-lockfile
      - name: Generate site route types
        run: bun --bun next typegen
      - name: Check site types
        run: bun run typecheck
      - name: Run site tests
        run: bun run test
      - name: Build static site
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docs:
    name: Documentation site full checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .docs-renderer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare pinned documentation renderer
        uses: ./.github/actions/prepare-docs-renderer
      - name: Install locked documentation dependencies
        run: bun install --frozen-lockfile
      - name: Check documentation types
        run: bun run typecheck
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Build static documentation site
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Verify documentation export
        run: bun run check:export
      - name: Stage verified export for upload
        # The artifact action excludes hidden paths by default.
        run: mv out "$RUNNER_TEMP/docs-preview"
      - name: Upload verified documentation preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warpdrive-docs-preview-${{ github.sha }}
          path: ${{ runner.temp }}/docs-preview/
          if-no-files-found: error
          retention-days: 7
      - name: Upload documentation preview provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warpdrive-docs-preview-provenance-${{ github.sha }}
          path: ${{ runner.temp }}/docs-preview-provenance.json
          if-no-files-found: error
          retention-days: 7
