name: Required quality checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_OPTIONS: --no-env-file

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Audit all production and development lockfile dependencies
        # No install, exclusions, severity exceptions, advisory ignores, fixes or retries.
        run: python3 scripts/delivery/security_audit.py --output "$RUNNER_TEMP/dependency-audit"
      - name: Retain raw audit evidence even when a lockfile gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-audit/
          if-no-files-found: error
          retention-days: 14

  workflows:
    if: github.event_name != 'schedule'
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download and verify official actionlint 1.7.12
        # Digest from rhysd/actionlint v1.7.12 official checksums; never execute an unverified download.
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Validate every committed Actions workflow and shell fragment
        run: '"$RUNNER_TEMP/actionlint" -color'

  browser:
    if: github.event_name != 'schedule'
    name: Browser smoke checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: warpdrive_browser_smoke_ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U smoke -d warpdrive_browser_smoke_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      NODE_ENV: production
      APP_COMMIT: ${{ github.sha }}
      DATABASE_URL: postgres://smoke:smoke@127.0.0.1:5432/warpdrive_browser_smoke_ci
      BASE_URL: https://127.0.0.1:3443
      GOOGLE_OAUTH_CLIENT_ID: ""
      GOOGLE_OAUTH_CLIENT_SECRET: ""
      AUTH_GOOGLE_ENABLED: "false"
      AUTH_ALLOW_PASSWORD: "true"
      AUTH_ALLOW_PASSKEY: "false"
      AUTH_SECRET: ci_browser_only_auth_secret_01234567890123456789
      AUTH_MAIL_TRANSPORT: smtp
      AUTH_MAIL_FROM: smoke@example.invalid
      AUTH_SMTP_HOST: 127.0.0.1
      AUTH_SMTP_PORT: "9"
      SEED_ADMIN_EMAIL: smoke@example.invalid
      ALLOW_FIRST_LOGIN_ADMIN: "false"
      WS_TICKET_SECRET: ci_browser_only_ws_secret_01234567890123456789
      WS_PUBLIC_URL: ws://127.0.0.1:8080
      # Existing client opt-out: these persistence journeys do not qualify realtime delivery.
      NEXT_PUBLIC_WS_URL: ""
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_ACCESS_KEY: ci-browser-access
      MINIO_SECRET_KEY: ci-browser-secret
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      MCP_ENABLED: "false"
      DISABLE_TELEMETRY: "true"
      DISABLE_UPDATE_CHECK: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Admit only disposable loopback targets
        run: python3 scripts/delivery/browser_smoke_environment.py
      - name: Install locked application and isolated browser tooling
        # Explicit development dependencies are needed to build, despite production runtime env.
        env:
          NODE_ENV: development
        run: |
          bun --no-env-file install --frozen-lockfile
          bun --no-env-file install --cwd tools/browser-smoke --frozen-lockfile --ignore-scripts
          bun --no-env-file tools/browser-smoke/node_modules/playwright/cli.js install --with-deps chromium
      - name: Apply canonical migrations to disposable database
        run: bun --no-env-file src/entrypoints/migrate.ts
      - name: Create the scoped synthetic browser actor through native auth storage
        run: bun --no-env-file scripts/browser-smoke-seed.mjs
      - name: Check workflow preference response attribution
        run: node --test scripts/browser-workflow-preference-actions.test.mjs
      - name: Build normal production application
        run: bun --no-env-file run build
      - name: Exercise actual Chromium without external requests
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1' \
            -keyout "$RUNNER_TEMP/browser.key" -out "$RUNNER_TEMP/browser.crt"
          bun --no-env-file --bun next start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/browser-app.log" 2>&1 &
          app_pid=$!
          bun --no-env-file scripts/browser-smoke-proxy.mjs "$RUNNER_TEMP/browser.key" "$RUNNER_TEMP/browser.crt" > "$RUNNER_TEMP/browser-proxy.log" 2>&1 &
          proxy_pid=$!
          cleanup() {
            kill "$proxy_pid" "$app_pid" 2>/dev/null || true
            wait "$proxy_pid" "$app_pid" 2>/dev/null || true
            cat "$RUNNER_TEMP/browser-app.log" "$RUNNER_TEMP/browser-proxy.log"
          }
          trap cleanup EXIT
          ready=0
          for _attempt in $(seq 1 60); do
            if curl --fail --silent --insecure https://127.0.0.1:3443/login > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          timeout 300s bun --no-env-file scripts/browser-smoke.mjs
          timeout 300s bun --no-env-file scripts/browser-workflow-preferences.mjs
      - name: Preserve workflow preference validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workflow-preferences-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/browser-smoke/workflow-preferences/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve browser failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/browser-smoke/
          if-no-files-found: warn
          retention-days: 14

  release-pr:
    if: github.event_name != 'schedule'
    name: Release PR validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate pre-merge release proposal and source review coherence
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/delivery/release_pr.py --base "$BASE_REVISION"
