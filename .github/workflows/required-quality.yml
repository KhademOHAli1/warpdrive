name: Required quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_OPTIONS: --no-env-file

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Audit all production and development lockfile dependencies
        # No install, exclusions, severity exceptions, advisory ignores, fixes or retries.
        run: python3 scripts/delivery/security_audit.py --output "$RUNNER_TEMP/dependency-audit"
      - name: Retain raw audit evidence even when a lockfile gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-audit/
          if-no-files-found: error
          retention-days: 14

  workflows:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download and verify official actionlint 1.7.12
        # Digest from rhysd/actionlint v1.7.12 official checksums; never execute an unverified download.
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Validate every committed Actions workflow and shell fragment
        run: '"$RUNNER_TEMP/actionlint" -color'

  browser:
    name: Browser smoke checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # This ordinary context intentionally admits and tests policy only. It does not start
      # PostgreSQL, install Playwright, build the app, launch Chromium or claim browser coverage.
      DATABASE_URL: postgres://smoke:smoke@127.0.0.1:5432/warpdrive_browser_smoke_ci
      BASE_URL: https://127.0.0.1:3443
      BUN_OPTIONS: --no-env-file
      AUTH_GOOGLE_ENABLED: "false"
      AUTH_SMTP_HOST: 127.0.0.1
      AUTH_SMTP_PORT: "9"
      DISABLE_TELEMETRY: "true"
      DISABLE_UPDATE_CHECK: "true"
      ALLOW_FIRST_LOGIN_ADMIN: "false"
      NEXT_PUBLIC_WS_URL: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run static disposable-browser admission test (no browser or database)
        run: python3 -m unittest discover -s scripts/delivery -p 'browser_smoke_environment_test.py'
      - name: Apply static disposable-browser environment guard (no browser or database)
        run: python3 scripts/delivery/browser_smoke_environment.py
      - name: Summarize static-only browser-check boundary
        if: always()
        run: |
          {
            echo "### Browser smoke checks (static guard only)"
            echo "This ordinary required context validates loopback/admission and external-effect policy only."
            echo "It does not run Chromium, PostgreSQL, the application build, native login, or user journeys."
            echo "Full browser qualification is explicit in full-quality.yml."
          } >> "$GITHUB_STEP_SUMMARY"

  release-pr:
    name: Release PR validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate pre-merge release proposal and source review coherence
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          args=(--base "$BASE_REVISION")
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/heads/* &&
                "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            test -n "$DEFAULT_BRANCH"
            integration_revision="$(git rev-parse --verify --end-of-options "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}")"
            args+=(--integration-revision "$integration_revision")
          fi
          python3 scripts/delivery/release_pr.py "${args[@]}"
