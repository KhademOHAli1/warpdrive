name: Image candidate publication

on:
  workflow_dispatch:
    inputs:
      image_run_id:
        description: Successful current-main production image qualification run retaining its tested bundle
        required: true
        type: string
      mode:
        description: Inspect evidence or explicitly publish the same tested images to GHCR
        required: true
        default: inspect
        type: choice
        options: [inspect, publish]

permissions:
  contents: read

concurrency:
  group: warpdrive-image-candidate-publication
  cancel-in-progress: false

jobs:
  admit:
    name: Verify candidate source and artifact admission
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: read
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE_RUN_ID: ${{ inputs.image_run_id }}
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact-main full CI, CodeQL findings and producer artifact
        run: |
          python3 scripts/deployment/publication_gate.py admit \
            --image-run-id "$IMAGE_RUN_ID" --expected-main "$SOURCE_REVISION" \
            --output "$RUNNER_TEMP/candidate/admission.json"
      - name: Inspect the same checksum-bound bundle without publishing
        if: inputs.mode == 'inspect'
        run: |
          python3 scripts/deployment/publication_gate.py download \
            --admission "$RUNNER_TEMP/candidate/admission.json" --expected-main "$SOURCE_REVISION" \
            --bundle-dir "$RUNNER_TEMP/candidate-bundle"
          python3 scripts/deployment/bundle.py verify \
            --bundle-dir "$RUNNER_TEMP/candidate-bundle" --expected-revision "$SOURCE_REVISION" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Retain source admission evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Publish tested image candidates
    needs: admit
    if: github.ref == 'refs/heads/main' && inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE_RUN_ID: ${{ inputs.image_run_id }}
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Recheck current main and download only its admitted bundle
        run: |
          python3 scripts/deployment/publication_gate.py admit \
            --image-run-id "$IMAGE_RUN_ID" --expected-main "$SOURCE_REVISION" \
            --output "$RUNNER_TEMP/candidate/admission.json"
          python3 scripts/deployment/publication_gate.py download \
            --admission "$RUNNER_TEMP/candidate/admission.json" --expected-main "$SOURCE_REVISION" \
            --bundle-dir "$RUNNER_TEMP/candidate-bundle"
      - name: Authenticate only the explicit publication job
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish exact retained image IDs and verify immutable manifests
        run: |
          repository_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          python3 scripts/deployment/publish_candidate.py \
            --bundle-dir "$RUNNER_TEMP/candidate-bundle" \
            --admission "$RUNNER_TEMP/candidate/admission.json" --expected-main "$SOURCE_REVISION" \
            --repository-prefix "$repository_prefix" --attempt-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --journal "$RUNNER_TEMP/candidate/publication-journal.json" \
            --output "$RUNNER_TEMP/candidate/registry-candidate.json"
      - name: Retain publication receipts including uncertain outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: warn
          retention-days: 30
