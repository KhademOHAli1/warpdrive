# Merge after docker-compose.yml, docker-compose.newsletters.yml and compose.yml.
# Supply qualified immutable image references. Native fixture and deployment hosts
# use the same model. Pull and inspect the admitted images before starting services.
services:
  caddy:
    image: "${WARPDRIVE_CADDY_IMAGE:?set WARPDRIVE_CADDY_IMAGE}"
    pull_policy: never
  postgres:
    image: "${WARPDRIVE_POSTGRES_IMAGE:?set WARPDRIVE_POSTGRES_IMAGE}"
    pull_policy: never
  minio:
    image: "${WARPDRIVE_STORAGE_IMAGE:?set WARPDRIVE_STORAGE_IMAGE}"
    pull_policy: never
  createbuckets:
    image: "${WARPDRIVE_STORAGE_INIT_IMAGE:?set WARPDRIVE_STORAGE_INIT_IMAGE}"
    pull_policy: never
    restart: "no"
    # Override storage images' declared /data volume with bounded ephemeral data.
    tmpfs:
      - /data:rw,noexec,nosuid,size=8m
    environment:
      WARPDRIVE_STORAGE_CLIENT_BIN: "${WARPDRIVE_STORAGE_CLIENT_BIN:-mc}"
    command: []
    entrypoint:
      - /bin/sh
      - -ec
      - |
        umask 077
        case "$$WARPDRIVE_STORAGE_CLIENT_BIN" in mc|mcli) ;; *) exit 64 ;; esac
        until "$$WARPDRIVE_STORAGE_CLIENT_BIN" --config-dir /tmp/warpdrive-fixture-client alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"; do
          echo 'waiting for minio'; sleep 2
        done
        "$$WARPDRIVE_STORAGE_CLIENT_BIN" --config-dir /tmp/warpdrive-fixture-client mb --ignore-existing "local/$$MINIO_BUCKET"
        "$$WARPDRIVE_STORAGE_CLIENT_BIN" --config-dir /tmp/warpdrive-fixture-client anonymous set none "local/$$MINIO_BUCKET"
  app:
    pull_policy: never
    environment:
      # First boot keeps the application integration unconfigured while the
      # engine remains available for separate passive qualification.
      NEWSLETTER_BASE_URL: ""
  worker:
    pull_policy: never
    environment:
      NEWSLETTER_BASE_URL: ""
  ws:
    pull_policy: never
  migrate:
    pull_policy: never
    restart: "no"
  newsletter-engine:
    build: !reset null
    image: "${WARPDRIVE_NEWSLETTER_IMAGE:?set WARPDRIVE_NEWSLETTER_IMAGE}"
    pull_policy: never
  newsletter-engine-migrate:
    build: !reset null
    image: "${WARPDRIVE_NEWSLETTER_IMAGE:?set WARPDRIVE_NEWSLETTER_IMAGE}"
    pull_policy: never
